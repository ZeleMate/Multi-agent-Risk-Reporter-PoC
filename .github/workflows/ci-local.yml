name: Local CI

# This repo's own CI jobs. The template wrote this file once and never updates it.
# ci.yml calls it on every PR and push, and the merge gate (ci-ok) waits for it.
# Ruff, mypy and pytest run in the central python.yml; this keeps the old CI's import
# smoke test for the heavy dependencies.
#
# Rules: no job may need a secret (Dependabot PRs get none), every action is pinned
# to a full commit SHA, and each job asks for read access only.
on:
  workflow_call:

permissions: {}

jobs:
  import-smoke:
    name: import smoke (langgraph, langchain, chromadb, openai)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Import the core dependencies
        run: |
          uv run python - <<'PY'
          import importlib
          for m in ["langgraph", "langchain", "chromadb", "openai"]:
              importlib.import_module(m)
          print("Core imports OK")
          PY
